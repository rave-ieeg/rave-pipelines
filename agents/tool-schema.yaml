# agents/tool-schema.yaml
#
# Optional settings for AI agents that use this app through MCP.
#
# `welcome`: a short text telling agents what the app is for. Agents see it
# in the `shidashi_sessions` tool.
#
# `tools`: optional fallback schemas for the MCP tool list.
#
# shidashi builds the MCP tool list by loading each module's tools without
# a browser, so most tools need no entry here. A schema listed here is used
# only when a module that lists the tool in its agents.yaml fails to load
# (for example, because a package it needs is not installed).
#
# Skills (agents/skills/) are discovered automatically and do NOT need to
# be listed here.
#
# Format follows the MCP tool schema:
#   tools:
#     - name: <tool_name>
#       description: <string>
#       inputSchema:
#         type: object
#         properties:
#           <param>:
#             type: <string|number|integer|boolean|array|object>
#             description: <string>
#         required: [<param>, ...]

welcome: >
  RAVE (Reproducible Analysis and Visualization of iEEG) dashboard (https://rave.wiki). 
  Official repository on Github: `rave-ieeg/rave-pipelines`. 

# The descriptions and arguments below mirror
# agents/tools/module_interactive_script.R: keep them in sync.
tools:
- name: module_interactive_script_list
  description: |
    List the interactive scripts registered by the module (names and
    descriptions), and whether the data are loaded.
    Unlike other tools, interactive scripts act on the live app session,
    as if the user clicked the module's buttons, e.g. `load_data` (load
    the data chosen in the loader) or `run_analysis` (run the analysis),
    if the module has them.
    Use `module_interactive_script_inspect` to check the details by name;
    and `module_interactive_script_run` to execute script by name.
  inputSchema:
    type: object
- name: module_interactive_script_inspect
  description: |
    Inspect an interactive script: its description, whether it needs
    the data loaded, whether it is running, and its R code.
    Use `module_interactive_script_run` to execute script by name.
  inputSchema:
    type: object
    properties:
      name:
        type: string
        description: >-
          Interactive script name, must be included from the result 
          returned by tool `module_interactive_script_list`
    required: [name]
- name: module_interactive_script_run
  description: |
    Execute module interactive script by name, as if the user clicked the
    corresponding button in the module (e.g. `load_data` or `run_analysis`).
    Most interactive scripts have side-effects (e.g. change the UI inputs,
    pipeline settings, or saved results): check what a script does with
    `module_interactive_script_inspect` first.
    All scripts except `load_data` need the data loaded first.
  inputSchema:
    type: object
    properties:
      name:
        type: string
        description: >-
          Interactive script name, must be included from the result 
          returned by tool `module_interactive_script_list`
    required: [name]
