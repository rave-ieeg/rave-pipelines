- name: Execute
  description: Full access
# `shiny_ui_operate` is left out on purpose: it clicks any element. Agents save
# epochs only with the script `save_agent_epoch` (never with the "Save &
# Download" button of the "Preview & export" dialog), and people select and
# edit the rows of the candidate and staged tables
